name: Publish to npm

on:
  push:
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # No registry-url here on purpose: setup-node would inject a placeholder
      # NODE_AUTH_TOKEN and an .npmrc auth line, and npm then uses that dummy
      # token instead of the OIDC trusted-publisher exchange.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trusted publishing (OIDC) needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
